<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WareFlow - Register</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="register-container">
    <div class="register-card">
        <div class="logo">WF</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join WareFlow Inventory Management</p>

        <div id="message" class="message"></div>

        <form id="registerForm">
            <div class="name-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="role">Account Role</label>
                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="COMPANY_ADMIN">Company Admin</option>
                    <option value="MANAGER">Manager</option>
                    <option value="WORKER">Worker</option>
                </select>
            </div>

            <div class="form-group">
                <label for="companyId">Company ID</label>
                <input type="number" id="companyId" min="1" required>
            </div>

            <button type="submit" id="registerButton">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </p>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
